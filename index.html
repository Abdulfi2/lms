<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Sertifikat Kelulusan - {{ $course->title }}</title>
    <style>
        /* ========== RESET & BASE ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DejaVu Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: white;
            margin: 0;
            padding: 0;
        }

        /* Container dengan background image */
        .certificate-container {
            width: 100%;
            position: relative;
            background-image: url('public/images/background.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Konten utama dengan padding yang proporsional */
        .certificate-content {
            padding: 40px 60px;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* ========== HEADER ========== */
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .logo-wrapper img {
            max-height: 64px;
            width: auto;
        }

        /* ========== TITLE ========== */
        .title-section {
            text-align: center;
            margin-bottom: 20px;
        }

        .certificate-title {
            font-size: 42px;
            font-weight: 800;
            color: #1f2937;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 16px;
            color: #4b5563;
        }

        /* ========== RECIPIENT ========== */
        .recipient-section {
            text-align: center;
            margin: 20px 0;
        }

        .recipient-name {
            font-size: 40px;
            font-weight: 800;
            color: #059669;
            text-transform: uppercase;
            margin: 15px 0;
            padding: 10px 20px;
            display: inline-block;
            letter-spacing: 1px;
        }

        .course-label {
            font-size: 14px;
            color: #4b5563;
            margin-top: 15px;
        }

        .course-title {
            font-size: 26px;
            font-weight: 700;
            color: #1d4ed8;
            margin: 10px 0;
        }

        /* ========== VERIFICATION SECTION ========== */
        .verification-section {
            width: 100%;
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }

        .qr-box {
            text-align: center;
            padding: 15px 25px;
            border-radius: 16px;
            display: inline-block;
        }

        .qr-code img {
            width: 100px;
            height: 100px;
            margin: 0 auto;
        }

        .verification-code {
            font-size: 11px;
            color: #6b7280;
            margin-top: 8px;
            font-family: monospace;
        }

        /* ========== FOOTER ========== */
        .footer-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(0, 0, 0, 0.1);
        }

        .footer-left,
        .footer-right {
            flex: 1;
        }

        .footer-left {
            text-align: left;
        }

        .footer-right {
            text-align: right;
        }

        .footer-label {
            font-size: 10px;
            color: #9ca3af;
            margin-bottom: 4px;
        }

        .footer-value {
            font-size: 13px;
            font-weight: 600;
            color: #1f2937;
        }

        .signature-line {
            width: 160px;
            height: 1px;
            background: #d1d5db;
            margin-top: 8px;
            margin-bottom: 4px;
            margin-left: auto;
        }

        /* ========== UTILITY ========== */
        .text-center {
            text-align: center;
        }

        /* Pastikan tidak ada page break */
        .certificate-container,
        .certificate-content {
            page-break-inside: avoid;
            page-break-after: avoid;
        }
    </style>
</head>

<body>
    <div class="certificate-container">
        <div class="certificate-content">
            <!-- Header dengan Logo -->
            <div class="header-section">
                <div class="logo-wrapper">
                    <img src="public/images/logo-zakatsukses.png" alt="Logo">
                </div>
                <div></div> <!-- Spacer untuk keseimbangan -->
            </div>

            <!-- Title Section -->
            <div class="title-section">
                <h1 class="certificate-title">SERTIFIKAT KELULUSAN</h1>
            </div>

            <!-- Recipient Section -->
            <div class="recipient-section">
                <p class="subtitle">Diberikan kepada</p>
                <div class="recipient-name">{{ $user->name }}</div>
                <p class="course-label">Atas kelulusannya pada kelas</p>
                <h2 class="course-title">{{ $course->title }}</h2>
            </div>

            <!-- Verification Section (QR Code) -->
            <div class="verification-section">
                <div class="qr-box">
                    <div class="qr-code">
                        <img src="data:image/png;base64,{{ $qr_code }}" alt="QR Code">
                    </div>
                    <p class="verification-code">Kode Verifikasi: {{ $verification_code }}</p>
                    <p style="font-size: 9px; color: #9ca3af;">Scan QR untuk verifikasi</p>
                </div>
            </div>

            <!-- Footer Section -->
            <div class="footer-section">
                <div class="footer-left">
                    <div class="footer-label">Diterbitkan pada</div>
                    <div class="footer-value">{{ $issued_at }}</div>
                </div>
                <div class="footer-right">
                    <div class="footer-label">Direktur</div>
                    <div class="footer-value">Dr. Sunarto Zulkifli S.TP, MM</div>
                    <div class="signature-line"></div>
                    <div style="font-size: 9px; color: #9ca3af; margin-top: 4px;">Chief Executive Officer</div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
